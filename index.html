Q.forEach(q=>{if(q[1]==2&&q.length<6)q[1]=1});
const $=s=>document.querySelector(s),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const LV=[["🌱","Facile"],["⚡","Moyen"],["🔥","Avancé"]];
let cfg={lvl:0,n:10,th:new Set(T.map((_,i)=>i))},S;
function chips(){$("#themes").innerHTML=`<button class="chip ${cfg.th.size==T.length?"on":""}" data-a="1">Tout</button>`+T.map((t,i)=>`<button class="chip ${cfg.th.has(i)?"on":""}" data-i="${i}">${t[0]} ${t[1]}</button>`).join("")}
function picks(){$("#lv").innerHTML=LV.map((l,i)=>`<button class="pick ${cfg.lvl==i?"on":""}" data-l="${i}"><b>${l[0]}</b>${l[1]}</button>`).join("");$("#nb").innerHTML=[10,20,30,40].map(n=>`<button class="pick ${cfg.n==n?"on":""}" data-n="${n}"><b>${n}</b>questions</button>`).join("")}
$("#themes").onclick=e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.a)cfg.th=new Set(T.map((_,i)=>i));else{let i=+b.dataset.i;cfg.th.has(i)?cfg.th.delete(i):cfg.th.add(i);if(!cfg.th.size)cfg.th.add(i)}chips();note()};
$("#lv").onclick=e=>{let b=e.target.closest("button");if(b){cfg.lvl=+b.dataset.l;picks();note()}};
$("#nb").onclick=e=>{let b=e.target.closest("button");if(b){cfg.n=+b.dataset.n;picks();note()}};
function pool(){let p=Q.filter(q=>cfg.th.has(q[0]));return sh(p).sort((a,b)=>Math.abs(a[1]-cfg.lvl)-Math.abs(b[1]-cfg.lvl))}
function note(){let m=Math.min(cfg.n,Q.filter(q=>cfg.th.has(q[0])).length);$("#note").textContent=m<cfg.n?`Banque actuelle : ${m} questions disponibles pour ta sélection.`:""}
function start(items){S={l:sh(items).map(q=>({q,o:sh([...q[3].keys()]),u:null})),i:0,sc:0,st:0,best:0};show("quiz");render()}
$("#go").onclick=()=>start(pool().slice(0,cfg.n));
function show(id){["home","quiz","res"].forEach(x=>$("#"+x).classList.toggle("hide",x!=id));scrollTo(0,0)}
function render(){let it=S.l[S.i],q=it.q,t=T[q[0]],m=q[5]||1;
$("#quiz").innerHTML=`<div class="card"><div class="top"><span>Question ${S.i+1}/${S.l.length}</span><span>✅ ${S.sc} · 🔥 ${S.st}</span></div><div class="bar"><i style="width:${S.i/S.l.length*100}%"></i></div><div class="tag">${t[0]} ${t[1]} · ${LV[q[1]][1]}</div><div class="q">${q[2]}</div>${m>1?`<div class="multi">☑ Plusieurs réponses possibles : coche toutes les bonnes</div>`:""}<div id="ops">${it.o.map(k=>`<button class="opt${m>1?" mu":""}" data-k="${k}">${q[3][k]}</button>`).join("")}</div><div id="fb">${m>1?'<button class="btn" id="vd">Valider ma sélection</button>':""}</div></div>`;
let sel=new Set();$("#ops").onclick=e=>{let b=e.target.closest(".opt");if(!b||it.u!==null)return;let k=+b.dataset.k;if(m==1)return answer(it,[k]);sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle("sl")};if(m>1)$("#vd").onclick=()=>{if(it.u===null&&sel.size)answer(it,[...sel])}}
function answer(it,arr){it.u=arr;let q=it.q,m=q[5]||1,ok=arr.length==m&&arr.every(k=>k<m),t=T[q[0]];it.ok=ok;
if(ok){S.sc++;S.st++;S.best=Math.max(S.best,S.st)}else S.st=0;
document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;b.classList.remove("sl");let x=+b.dataset.k;if(x<m)b.classList.add("ok");else if(arr.includes(x))b.classList.add("ko")});
let last=S.i==S.l.length-1;
$("#fb").innerHTML=`<div class="fb ${ok?"ok":"ko"}"><b>${ok?"✅ Bonne réponse !":"❌ Pas tout à fait."}</b>${ok?"":`<p>Bonne(s) réponse(s) : <b>${q[3].slice(0,m).join(" · ")}</b></p>`}<p>💡 ${q[4]}</p>${ok?"":`<div class="tip">📘 <b>Règle :</b> ${t[2]}<br>⭐ <b>Astuce :</b> ${t[3]}</div>`}</div><button class="btn" id="nx">${last?"Voir mon résultat 🏁":"Question suivante →"}</button>`;
$("#nx").onclick=()=>{if(last)result();else{S.i++;render()}};$("#nx").scrollIntoView({behavior:"smooth",block:"nearest"})}
function result(){let n=S.l.length,p=Math.round(S.sc/n*100),w=S.l.filter(x=>!x.ok),msg=p>=80?"🏆 Excellent ! Tu es prêt(e) pour l’examen.":p>=60?"👍 Bien ! Encore un peu de révision.":"💪 Continue, relis les règles et astuces.";
$("#res").innerHTML=`<div class="card c"><h2>Résultat final</h2><div class="ring" style="background:conic-gradient(var(--pr) ${p*3.6}deg,var(--bd) 0)"><span>${p}%</span></div><p><b>${msg}</b></p><div class="stats"><div>✅<br><b>${S.sc}</b></div><div>❌<br><b>${w.length}</b></div><div>🔥 série<br><b>${S.best}</b></div></div>
${w.length?`<button class="btn" id="rt">🔁 Refaire mes erreurs (${w.length})</button><br><br><button class="btn sec" id="rv">👀 Revoir mes fausses réponses</button><br><br>`:""}<button class="btn sec" id="nw">🏠 Nouveau QCM</button></div><div id="rvl"></div>`;
show("res");
if(w.length){$("#rt").onclick=()=>start(w.map(x=>x.q));
$("#rv").onclick=()=>{$("#rvl").innerHTML=`<div class="card"><h2>Mes erreurs</h2>`+w.map(x=>{let q=x.q,t=T[q[0]];return `<div class="rv"><b>${q[2]}</b><br><small>Ta réponse : ${x.u.map(k=>q[3][k]).join(" · ")}</small><br>✅ <b>${q[3].slice(0,q[5]||1).join(" · ")}</b><br>💡 ${q[4]}<div class="tip">📘 ${t[2]}<br>⭐ ${t[3]}</div></div>`}).join("")+`</div>`;$("#rvl").scrollIntoView({behavior:"smooth"})}}
$("#nw").onclick=()=>show("home")}

chips();picks();note();
